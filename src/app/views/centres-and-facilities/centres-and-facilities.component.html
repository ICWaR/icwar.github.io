<div class="container-fluid text-center mt-3">
  <h2><b>Centres and Facilities</b></h2>
</div>
<hr />

<div class="accordion container px-5 mb-3" id="facilitiesAccordion">
  <div
    class="accordion-item"
    *ngFor="let facility of facilitiesList; let i = index"
  >
    <h2 class="accordion-header" id="heading{{ i }}">
      <button
        class="accordion-button collapsed"
        type="button"
        data-bs-toggle="collapse"
        [attr.data-bs-target]="'#collapse' + i"
        aria-expanded="false"
        [attr.aria-controls]="'collapse' + i"
      >
        {{ facility.deviceName }}
      </button>
    </h2>
    <div
      [id]="'collapse' + i"
      class="accordion-collapse collapse"
      [attr.aria-labelledby]="'heading' + i"
      data-bs-parent="#facilitiesAccordion"
    >
      <div class="accordion-body row justify-content-center my-3">
        <div class="col-md-5 col-sm-12 m-2 py-1 bg-light">
          <p [innerHTML]="facility.description"></p>
        </div>
        <span class="d-none d-md-inline" style="width: 3px"></span>
        <div class="col-md-4 col-sm-12 m-2">
          <img
            class="col-12 img-thumbnail"
            [src]="facility.imgSrc"
            [alt]="facility.deviceName"
          />
        </div>
      </div>
    </div>
  </div>
</div>
